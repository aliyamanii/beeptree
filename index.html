<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B+ Tree Visual Simulator</title>
    <link rel="stylesheet" href="./styles.css" id="main-stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>B+ Tree Visual Simulator</h1>
            <p class="subtitle">Interactive visualization of B+ tree operations</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="order-input">Tree Order</label>
                <input type="number" id="order-input" min="3" value="4" placeholder="Minimum 3" />
            </div>
            <div class="control-group horizontal">
                <input type="number" id="value-input" placeholder="Enter value" />
                <button id="insert-btn">Insert</button>
                <button id="delete-btn">Delete</button>
                <button id="search-btn">Search</button>
                <button id="clear-btn">Clear</button>
            </div>
            <div class="control-group">
                <button id="random-btn">Insert Random (10)</button>
            </div>
            <div class="control-group full-width">
                <div class="tip-text">
                    💡 <strong>Tip:</strong> Hold <strong>Shift</strong> while clicking Insert or Search for step-by-step mode
                </div>
            </div>
        </div>

        <div class="status" id="status"></div>

        <div class="step-controls" id="step-controls" style="display: none;">
            <div class="step-info">
                <span id="step-counter">Step 0 of 0</span>
            </div>
            <div class="step-buttons">
                <button id="first-step-btn">⏮ First</button>
                <button id="prev-step-btn">⏪ Previous</button>
                <button id="play-pause-btn">▶ Play</button>
                <button id="next-step-btn">Next ⏩</button>
                <button id="last-step-btn">Last ⏭</button>
                <button id="close-steps-btn">Close</button>
            </div>
        </div>

        <div class="explanation-panel" id="explanation-panel" style="display: none;">
            <h3>Step Explanation</h3>
            <p id="explanation-text">No explanation available.</p>
        </div>

        <div class="canvas-container">
            <canvas id="tree-canvas"></canvas>
        </div>
    </div>

    <script type="module">
        // Fix paths for GitHub Pages subdirectory and local development
        (function() {
            // Get the directory path (remove filename if present)
            let pathname = window.location.pathname;
            
            // Remove filename (like index.html) from path
            if (pathname.endsWith('.html') || pathname.endsWith('/')) {
                pathname = pathname.replace(/\/[^/]*\.html$/, '').replace(/\/$/, '');
            }
            
            // Get path parts (excluding empty strings)
            const pathParts = pathname.split('/').filter(p => p);
            
            // If first part looks like a repo name (not a file), use it as base
            // Otherwise, we're at root or in a file, so use root
            const firstPart = pathParts[0] || '';
            const isRepoName = firstPart && !firstPart.includes('.') && pathname.startsWith('/' + firstPart + '/');
            const basePath = isRepoName ? '/' + firstPart + '/' : '/';
            
            // Fix CSS path
            const stylesheet = document.getElementById('main-stylesheet');
            if (stylesheet) {
                stylesheet.href = basePath + 'styles.css';
            }
            
            // Store base path for the module loader
            window.__APP_BASE_PATH__ = basePath;
        })();
    </script>
    <script type="module">
        // Dynamically determine base path and load main.js
        (async function() {
            try {
                const basePath = window.__APP_BASE_PATH__ || '/';
                const modulePath = basePath + 'dist/main.js';
                
                console.log('Loading application from:', modulePath);
                console.log('Current pathname:', window.location.pathname);
                console.log('Base path:', basePath);
                
                // Load main.js - imports inside will resolve relative to dist/main.js
                await import(modulePath);
                console.log('Application loaded successfully');
            } catch (err) {
                console.error('Failed to load application:', err);
                const errorMessage = err instanceof Error ? err.message : String(err);
                document.body.innerHTML = `
                    <div style="padding: 40px; text-align: center; color: #ef4444; font-family: Arial;">
                        <h2>Error Loading Application</h2>
                        <p>Failed to load the application module.</p>
                        <p>Check the browser console (F12) for details.</p>
                        <p style="font-size: 12px; color: #666;">Error: ${errorMessage}</p>
                        <p style="font-size: 12px; color: #666;">Path: ${window.location.pathname}</p>
                        <p style="font-size: 12px; color: #666;">Base: ${window.__APP_BASE_PATH__ || '/'}</p>
                    </div>
                `;
            }
        })();
    </script>
</body>
</html>
