<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B+ Tree Visual Simulator</title>
    <link rel="stylesheet" href="./styles.css" id="main-stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-controls">
                <button id="language-toggle" class="language-toggle" aria-label="Toggle language">
                    <span class="language-icon">EN</span>
                </button>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
            <h1>B+ Tree Visual Simulator</h1>
            <p class="subtitle">Interactive visualization of B+ tree operations</p>
        </header>

        <div class="controls">
            <div class="control-row">
                <label for="order-input" data-i18n="treeOrder">Order:</label>
                <input type="number" id="order-input" min="3" value="4" data-i18n-placeholder="orderPlaceholder" />
                <input type="number" id="value-input" data-i18n-placeholder="enterValue" />
                <button id="insert-btn" data-i18n="insert">Insert</button>
                <button id="delete-btn" data-i18n="delete">Delete</button>
                <button id="search-btn" data-i18n="search">Search</button>
                <button id="clear-btn" data-i18n="clear">Clear</button>
                <button id="random-btn"><span data-i18n="random">Random</span> <span data-i18n="randomCount">(10)</span></button>
            </div>
            <div class="tip-text" data-i18n="tipText">
                💡 Hold <strong>Shift</strong> while clicking Insert or Search for step-by-step mode
            </div>
        </div>

        <div class="step-controls" id="step-controls" style="display: none;">
            <div class="step-info">
                <span id="step-counter"><span data-i18n="step">Step</span> 0 <span data-i18n="of">of</span> 0</span>
            </div>
            <div class="step-buttons">
                <button id="first-step-btn">⏮ <span data-i18n="first">First</span></button>
                <button id="prev-step-btn">⏪ <span data-i18n="previous">Previous</span></button>
                <button id="play-pause-btn">▶ <span data-i18n="play">Play</span></button>
                <button id="next-step-btn"><span data-i18n="next">Next</span> ⏩</button>
                <button id="last-step-btn"><span data-i18n="last">Last</span> ⏭</button>
                <button id="close-steps-btn" data-i18n="close">Close</button>
            </div>
        </div>

        <div class="explanation-panel" id="explanation-panel" style="display: none;">
            <h3 data-i18n="stepExplanation">Step Explanation</h3>
            <p id="explanation-text" data-i18n="noExplanationAvailable">No explanation available.</p>
        </div>

        <div class="canvas-container">
            <canvas id="tree-canvas"></canvas>
        </div>
    </div>

    <div id="toast-container"></div>

    <script type="module">
        // Fix paths for GitHub Pages subdirectory and local development
        (function() {
            // Get the original pathname
            const originalPathname = window.location.pathname;
            
            // Remove filename (like index.html) from path to get directory
            let dirPath = originalPathname.replace(/\/[^/]*\.html$/, '');
            // Ensure it ends with / for directory paths
            if (dirPath && !dirPath.endsWith('/')) {
                dirPath += '/';
            }
            // If we're at root, dirPath will be empty or just '/'
            if (dirPath === '/') {
                dirPath = '/';
            }
            
            // Get path parts (excluding empty strings)
            const pathParts = dirPath.split('/').filter(p => p);
            
            // If we have path parts and the first part looks like a repo name (no file extension)
            // use it as base path
            let basePath = '/';
            if (pathParts.length > 0) {
                const firstPart = pathParts[0];
                // Check if it's a repo name (not a file - no extension)
                if (firstPart && !firstPart.includes('.')) {
                    basePath = '/' + firstPart + '/';
                }
            }
            
            // Fix CSS path
            const stylesheet = document.getElementById('main-stylesheet');
            if (stylesheet) {
                stylesheet.href = basePath + 'styles.css';
            }
            
            // Store base path for the module loader
            window.__APP_BASE_PATH__ = basePath;
        })();
    </script>
    <script type="module">
        // Dynamically determine base path and load main.js
        (async function() {
            try {
                const basePath = window.__APP_BASE_PATH__ || '/';
                const modulePath = basePath + 'dist/main.js';
                
                console.log('Loading application from:', modulePath);
                console.log('Current pathname:', window.location.pathname);
                console.log('Base path:', basePath);
                
                // Load main.js - imports inside will resolve relative to dist/main.js
                await import(modulePath);
                console.log('Application loaded successfully');
            } catch (err) {
                console.error('Failed to load application:', err);
                const errorMessage = err instanceof Error ? err.message : String(err);
                document.body.innerHTML = `
                    <div style="padding: 40px; text-align: center; color: #ef4444; font-family: Arial;">
                        <h2>Error Loading Application</h2>
                        <p>Failed to load the application module.</p>
                        <p>Check the browser console (F12) for details.</p>
                        <p style="font-size: 12px; color: #666;">Error: ${errorMessage}</p>
                        <p style="font-size: 12px; color: #666;">Path: ${window.location.pathname}</p>
                        <p style="font-size: 12px; color: #666;">Base: ${window.__APP_BASE_PATH__ || '/'}</p>
                    </div>
                `;
            }
        })();
    </script>
</body>
</html>
